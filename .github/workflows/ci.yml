name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Backend testing and building
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['9.2.8']
        cabal: ['3.8']
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Haskell
      uses: haskell/actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ matrix.cabal }}
        enable-stack: true

    - name: Cache Stack dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.stack
          backend/.stack-work
        key: ${{ runner.os }}-stack-${{ matrix.ghc }}-${{ hashFiles('backend/stack.yaml', 'backend/package.yaml') }}
        restore-keys: |
          ${{ runner.os }}-stack-${{ matrix.ghc }}-
          ${{ runner.os }}-stack-

    - name: Install dependencies
      working-directory: backend
      run: |
        stack setup
        stack build --dependencies-only --no-terminal --jobs=4

    - name: Build
      working-directory: backend
      run: stack build --no-terminal --jobs=4 --ghc-options="-O2 -Wall -Werror"

    - name: Run tests
      working-directory: backend
      run: stack test --no-terminal --ta "--jobs=4 --quickcheck-tests=100"

    - name: Generate coverage report
      working-directory: backend
      run: |
        stack test --coverage --no-terminal
        stack hpc report --all

  # Frontend testing and building
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache PureScript dependencies
      uses: actions/cache@v3
      with:
        path: |
          frontend/.spago
          frontend/output
          ~/.cache/spago
        key: ${{ runner.os }}-spago-${{ hashFiles('frontend/spago.dhall', 'frontend/packages.dhall') }}
        restore-keys: |
          ${{ runner.os }}-spago-

    - name: Install dependencies
      working-directory: frontend
      run: |
        npm ci --prefer-offline --no-audit
        npm install -g purescript@0.15.9 spago@0.21.0

    - name: Build PureScript
      working-directory: frontend
      run: |
        spago install
        spago build --purs-args "--jobs 4"

    - name: Run tests
      working-directory: frontend
      run: spago test

    - name: Build production bundle
      working-directory: frontend
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist-${{ matrix.node-version }}
        path: frontend/dist/

  # Docker build and security scan
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      run: |
        docker-compose build --parallel

    - name: Run Trivy vulnerability scanner - Backend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'trend2zero/backend:latest'
        format: 'sarif'
        output: 'backend-trivy-results.sarif'

    - name: Run Trivy vulnerability scanner - Frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'trend2zero/frontend:latest'
        format: 'sarif'
        output: 'frontend-trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: '.'

  # Integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker
    
    steps:
    - uses: actions/checkout@v4

    - name: Start services
      run: |
        docker-compose up -d
        docker-compose ps

    - name: Wait for services
      run: |
        timeout 60 sh -c 'until curl -f http://localhost:8080/health; do sleep 1; done'
        timeout 60 sh -c 'until curl -f http://localhost:3000/; do sleep 1; done'

    - name: Run integration tests
      run: |
        # Add your integration test commands here
        curl -f http://localhost:8080/health
        curl -f http://localhost:3000/

    - name: Collect logs on failure
      if: failure()
      run: |
        docker-compose logs
        docker-compose down

    - name: Stop services
      run: docker-compose down

  # Deploy (only on main branch)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build and tag images
        docker-compose build --parallel
        
        # Tag for ECR
        docker tag trend2zero/backend:latest $ECR_REGISTRY/trend2zero/backend:$IMAGE_TAG
        docker tag trend2zero/backend:latest $ECR_REGISTRY/trend2zero/backend:latest
        docker tag trend2zero/frontend:latest $ECR_REGISTRY/trend2zero/frontend:$IMAGE_TAG
        docker tag trend2zero/frontend:latest $ECR_REGISTRY/trend2zero/frontend:latest
        
        # Push to ECR
        docker push $ECR_REGISTRY/trend2zero/backend:$IMAGE_TAG
        docker push $ECR_REGISTRY/trend2zero/backend:latest
        docker push $ECR_REGISTRY/trend2zero/frontend:$IMAGE_TAG
        docker push $ECR_REGISTRY/trend2zero/frontend:latest

    # Add your deployment steps here (ECS, Kubernetes, etc.)